plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fnvideo.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.fnvideo.app'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Published builds must use the persistent repository signing identity.
    def signingPath = System.getenv('FNVIDEO_SIGNING_STORE')
    def signingPassword = System.getenv('FNVIDEO_SIGNING_PASSWORD')
    if (System.getenv('FNVIDEO_REQUIRE_SIGNING') == 'true'
            && (!signingPath || !signingPassword || !file(signingPath).isFile())) {
        throw new GradleException('Persistent APK signing credentials are required')
    }
    signingConfigs {
        if (signingPath && signingPassword) {
            persistent {
                storeFile file(signingPath)
                storeType 'PKCS12'
                storePassword signingPassword
                keyAlias 'fnvideo'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        debug {
            if (signingPath && signingPassword) {
                signingConfig signingConfigs.persistent
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
