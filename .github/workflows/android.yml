name: Android build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'fix/**'
      - 'codex/product-integration'

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Archive tracked source for reproducible verification
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/fnvideo-source.zip"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fnvideo-source-${{ github.sha }}
          path: ${{ runner.temp }}/fnvideo-source.zip
          if-no-files-found: error
          retention-days: 3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Restore persistent signing identity
        if: github.event_name == 'push'
        env:
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          test -n "$SIGNING_KEYSTORE" && test -n "$SIGNING_PASSWORD" && test -n "$SIGNING_CERT_SHA256"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/fnvideo-signing.p12"

      - name: Build debug APK
        env:
          FNVIDEO_REQUIRE_SIGNING: ${{ github.event_name == 'push' }}
          FNVIDEO_SIGNING_STORE: ${{ github.event_name == 'push' && format('{0}/fnvideo-signing.p12', runner.temp) || '' }}
          FNVIDEO_SIGNING_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_SIGNING_PASSWORD || '' }}
        run: ./gradlew assembleDebug

      - name: Verify persistent APK signature
        if: github.event_name == 'push'
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-signature.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")
          test "$actual" = "$EXPECTED_CERT_SHA256"
          echo "Verified persistent APK signing certificate"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fnvideo-signing.p12"

      - name: Verify packaged APK version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-badging.txt"
          package_info=$(head -n 1 "$RUNNER_TEMP/apk-badging.txt")
          echo "$package_info"
          version_name=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          version_code=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          [[ "$package_info" == *"versionCode='$version_code'"* ]]
          [[ "$package_info" == *"versionName='$version_name'"* ]]

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnvideo-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fnvideo-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          version_code=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          tag="build-${version_name}-${version_code}-${GITHUB_SHA::7}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "牛影随看 ${version_name}" \
            --notes "Automated debug APK built from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"

      - name: Publish test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/horizontal-seek-start'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          version_code=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          tag="v${version_name}"
          asset="$RUNNER_TEMP/fnvideo-v${version_name}-${version_code}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          notes="$RUNNER_TEMP/test-release-notes.md"
          cat > "$notes" <<NOTES
          拖动播放进度时显示目标时间与总时长。
          新增原生影视库登录页及局域网发现；输入服务器地址、用户名和密码连接。
          APK 使用固定签名，今后使用同一签名且版本递增的构建可以覆盖升级。
          旧临时签名包无法直接迁移到新签名；首次迁移仍可能需要卸载，卸载会清除本地设置。

          APK versionName: ${version_name}; versionCode: ${version_code}.
          单元测试（含触摸回归）、Lint、编译、最终 APK 版本及固定签名核验已通过。
          Debug APK；原生登录、局域网发现、手势及覆盖升级尚待真机验证。
          Commit: ${GITHUB_SHA}
          CI: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          NOTES
          gh release create "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --title "牛影随看 ${version_name} 测试版" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA" --prerelease --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
