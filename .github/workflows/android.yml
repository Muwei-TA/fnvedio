name: Android build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Archive tracked source for reproducible verification
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/fnvideo-source.zip"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fnvideo-source-${{ github.sha }}
          path: ${{ runner.temp }}/fnvideo-source.zip
          if-no-files-found: error
          retention-days: 3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify packaged APK version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-badging.txt"
          package_info=$(head -n 1 "$RUNNER_TEMP/apk-badging.txt")
          echo "$package_info"
          version_name=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          version_code=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          [[ "$package_info" == *"versionCode='$version_code'"* ]]
          [[ "$package_info" == *"versionName='$version_name'"* ]]

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnvideo-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fnvideo-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          version_code=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          tag="build-${version_name}-${version_code}-${GITHUB_SHA::7}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "牛影随看 ${version_name} (${version_code})" \
            --notes "Automated debug APK built from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"

      - name: Publish gesture fix test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/horizontal-seek-start'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          version_code=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          tag="v${version_name}"
          asset="$RUNNER_TEMP/fnvideo-v${version_name}-${version_code}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          notes="$RUNNER_TEMP/test-release-notes.md"
          cat > "$notes" <<NOTES
          视频画面单击与横向拖动冲突修复测试版。
          按下不触发单击；抬手单击；拖动阈值适配屏幕密度并锁定方向。

          APK versionName: ${version_name}; versionCode: ${version_code}.
          单元测试（含触摸回归）、Lint、编译和最终 APK 版本核验已通过。
          Debug APK；手机实际手感尚待复测。
          Commit: ${GITHUB_SHA}
          CI: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          NOTES
          gh release create "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --title "牛影随看 ${version_name} (${version_code}) 测试版" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA" --prerelease --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
